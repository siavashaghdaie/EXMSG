upstream backend {
    server backend:3001;
}

server {
    listen 80;
    server_name theomnilink.io www.theomnilink.io _;
    client_max_body_size 50M;

    # Let's Encrypt ACME challenge (^~ prevents regex overrides)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Health check (keep on HTTP for Docker healthcheck)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirect all other HTTP traffic to HTTPS (only if SSL cert exists)
    # Before SSL is set up, this block serves the app on HTTP
    set $redirect_to_https 0;
    if (-f /etc/letsencrypt/live/theomnilink.io/fullchain.pem) {
        set $redirect_to_https 1;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;

    # Root location - serve static files
    root /usr/share/nginx/html;

    # Static files with long caching
    location ~* ^/assets/ {
        if ($redirect_to_https) { return 301 https://$host$request_uri; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static files with moderate caching
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|eot|otf)$ {
        if ($redirect_to_https) { return 301 https://$host$request_uri; }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Proxy uploaded files (avatars, chat attachments, status media) to backend
    location /uploads/ {
        if ($redirect_to_https) { return 301 https://$host$request_uri; }
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy API requests to backend
    location /api/ {
        if ($redirect_to_https) { return 301 https://$host$request_uri; }
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy Socket.IO requests to backend with WebSocket upgrade
    location /socket.io/ {
        if ($redirect_to_https) { return 301 https://$host$request_uri; }
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA routing - serve index.html for all non-file requests
    location / {
        if ($redirect_to_https) { return 301 https://$host$request_uri; }
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
