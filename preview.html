<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exclusive Messenger — Live Preview</title>
<style>
  :root {
    --blue-50: #eff6ff; --blue-100: #dbeafe; --blue-500: #3b82f6; --blue-600: #2563eb; --blue-700: #1d4ed8;
    --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-300: #d1d5db;
    --gray-400: #9ca3af; --gray-500: #6b7280; --gray-600: #4b5563; --gray-700: #374151;
    --gray-800: #1f2937; --gray-900: #111827;
    --green-500: #22c55e; --red-500: #ef4444; --indigo-600: #4f46e5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 999px; }

  /* ====== LOGIN PAGE ====== */
  .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 50%, #f0ecff 100%); position: relative; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.4; animation: blobAnim 7s ease-in-out infinite; }
  .blob-1 { width: 300px; height: 300px; background: #93c5fd; top: -50px; left: -50px; }
  .blob-2 { width: 250px; height: 250px; background: #a5b4fc; top: 100px; right: -30px; animation-delay: 2s; }
  .blob-3 { width: 280px; height: 280px; background: #c4b5fd; bottom: -60px; left: 30%; animation-delay: 4s; }
  @keyframes blobAnim { 0%{transform:translate(0,0) scale(1)} 33%{transform:translate(30px,-40px) scale(1.1)} 66%{transform:translate(-20px,20px) scale(0.9)} 100%{transform:translate(0,0) scale(1)} }

  .login-card { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 40px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.6); animation: fadeUp 0.5s ease-out; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .login-logo { width: 56px; height: 56px; background: linear-gradient(135deg, var(--blue-600), var(--indigo-600)); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 10px 20px rgba(37,99,235,0.3); }
  .login-title { font-size: 24px; font-weight: 700; color: var(--gray-900); text-align: center; }
  .login-subtitle { font-size: 14px; color: var(--gray-500); text-align: center; margin-top: 4px; margin-bottom: 28px; }

  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--gray-700); margin-bottom: 6px; }
  .form-input-wrap { position: relative; }
  .form-input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
  .form-input { width: 100%; padding: 10px 14px 10px 40px; border: 1px solid var(--gray-300); border-radius: 12px; font-size: 14px; outline: none; transition: all 0.2s; background: rgba(255,255,255,0.7); }
  .form-input:focus { border-color: var(--blue-500); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

  .form-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 20px; }
  .form-row label { display: flex; align-items: center; gap: 6px; color: var(--gray-600); cursor: pointer; }
  .form-row a { color: var(--blue-600); font-weight: 500; text-decoration: none; }

  .login-btn { width: 100%; padding: 11px; background: linear-gradient(135deg, var(--blue-600), var(--indigo-600)); color: white; font-size: 15px; font-weight: 600; border-radius: 12px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(37,99,235,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .login-btn:hover { box-shadow: 0 6px 20px rgba(37,99,235,0.4); transform: translateY(-1px); }
  .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
  .login-footer { text-align: center; font-size: 13px; color: var(--gray-500); margin-top: 24px; }
  .login-footer a { color: var(--blue-600); font-weight: 500; text-decoration: none; }

  .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* ====== CHAT LAYOUT ====== */
  .app { display: flex; height: 100vh; background: white; }

  /* Sidebar */
  .sidebar { width: 320px; border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; background: white; flex-shrink: 0; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--gray-100); }
  .sidebar-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sidebar-title { font-size: 18px; font-weight: 700; color: var(--gray-900); }
  .icon-btn { padding: 8px; border-radius: 8px; transition: background 0.15s; color: var(--gray-500); }
  .icon-btn:hover { background: var(--gray-100); }

  .user-mini { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; transition: background 0.15s; cursor: pointer; }
  .user-mini:hover { background: var(--gray-50); }
  .user-mini-name { font-size: 13px; font-weight: 500; color: var(--gray-900); }
  .user-mini-email { font-size: 11px; color: var(--gray-500); }

  .search-wrap { padding: 12px 16px; }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
  .search-input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--gray-200); border-radius: 12px; font-size: 13px; background: var(--gray-50); outline: none; transition: all 0.2s; }
  .search-input:focus { border-color: var(--blue-500); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); background: white; }

  .new-chat-btn { margin: 0 16px 8px; padding: 9px; background: var(--blue-600); color: white; border-radius: 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s; box-shadow: 0 2px 6px rgba(37,99,235,0.2); }
  .new-chat-btn:hover { background: var(--blue-700); }

  .conv-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .conv-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; transition: all 0.15s; text-align: left; }
  .conv-item:hover { background: var(--gray-50); }
  .conv-item.active { background: var(--blue-50); }
  .conv-info { flex: 1; min-width: 0; }
  .conv-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .conv-name { font-size: 13px; font-weight: 500; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-item.active .conv-name { color: #1e3a8a; }
  .conv-time { font-size: 11px; color: var(--gray-400); flex-shrink: 0; margin-left: 8px; }
  .conv-time.unread { color: var(--blue-600); font-weight: 500; }
  .conv-bottom { display: flex; align-items: center; justify-content: space-between; }
  .conv-preview { font-size: 12px; color: var(--gray-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-preview.unread { color: var(--gray-700); font-weight: 500; }
  .conv-badge { width: 20px; height: 20px; border-radius: 50%; background: var(--blue-600); color: white; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 8px; }

  /* Avatar */
  .avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; flex-shrink: 0; position: relative; }
  .avatar-sm { width: 32px; height: 32px; font-size: 12px; }
  .avatar-md { width: 40px; height: 40px; font-size: 14px; }
  .avatar-lg { width: 48px; height: 48px; font-size: 16px; }
  .online-dot { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid white; }
  .online-dot.on { background: var(--green-500); }
  .online-dot.off { background: var(--gray-300); }

  /* Chat area */
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: white; }
  .chat-header-info { display: flex; align-items: center; gap: 12px; }
  .chat-header-name { font-size: 15px; font-weight: 600; color: var(--gray-900); }
  .chat-header-status { font-size: 12px; color: var(--gray-500); }
  .chat-header-actions { display: flex; gap: 4px; }

  .messages { flex: 1; overflow-y: auto; padding: 16px 0; }
  .date-sep { display: flex; align-items: center; gap: 12px; margin: 16px 16px; }
  .date-sep-line { flex: 1; height: 1px; background: var(--gray-200); }
  .date-sep-text { font-size: 11px; color: var(--gray-400); font-weight: 500; }

  .msg-row { display: flex; padding: 2px 16px; margin-bottom: 2px; animation: msgIn 0.25s ease-out; }
  .msg-row.own { justify-content: flex-end; }
  @keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .msg-group { display: flex; gap: 8px; max-width: 460px; }
  .msg-row.own .msg-group { flex-direction: row-reverse; }
  .msg-col { display: flex; flex-direction: column; }
  .msg-row.own .msg-col { align-items: flex-end; }
  .msg-sender { font-size: 11px; color: var(--gray-500); margin-bottom: 2px; padding-left: 4px; }

  .msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45; position: relative; word-wrap: break-word; }
  .msg-bubble.other { background: var(--gray-100); color: var(--gray-900); border-bottom-left-radius: 4px; }
  .msg-bubble.own { background: var(--blue-500); color: white; border-bottom-right-radius: 4px; }

  .msg-meta { display: flex; align-items: center; gap: 4px; margin-top: 3px; padding: 0 4px; }
  .msg-row.own .msg-meta { justify-content: flex-end; }
  .msg-time { font-size: 11px; color: var(--gray-400); }
  .msg-check { color: var(--gray-300); }
  .msg-check.read { color: var(--blue-500); }

  .msg-reactions { display: flex; gap: 4px; margin-top: 4px; }
  .msg-row.own .msg-reactions { justify-content: flex-end; }
  .reaction-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 99px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .reaction-pill.own-bg { background: rgba(255,255,255,0.2); color: white; }
  .reaction-pill.other-bg { background: var(--gray-200); color: var(--gray-700); }
  .reaction-pill:hover { transform: scale(1.1); }

  .msg-hover-actions { position: absolute; top: -30px; display: flex; gap: 2px; background: white; border-radius: 99px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); border: 1px solid var(--gray-200); padding: 4px; z-index: 5; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
  .msg-bubble:hover .msg-hover-actions { opacity: 1; pointer-events: auto; }
  .msg-bubble.own .msg-hover-actions { right: 0; }
  .msg-bubble.other .msg-hover-actions { left: 0; }
  .msg-hover-btn { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: background 0.15s; }
  .msg-hover-btn:hover { background: var(--gray-100); }

  .typing-row { display: flex; align-items: center; gap: 8px; padding: 4px 16px; }
  .typing-dots { display: flex; gap: 4px; background: var(--gray-100); border-radius: 18px; padding: 10px 16px; }
  .typing-dot { width: 7px; height: 7px; background: var(--gray-400); border-radius: 50%; animation: dotBounce 1.4s ease-in-out infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

  /* Composer */
  .composer { padding: 12px 16px; border-top: 1px solid var(--gray-200); flex-shrink: 0; }
  .composer-inner { display: flex; align-items: flex-end; gap: 10px; background: var(--gray-50); border-radius: 20px; padding: 10px 14px; transition: all 0.2s; }
  .composer-inner.focused { box-shadow: 0 0 0 2px var(--blue-500); background: white; }
  .composer-input { flex: 1; border: none; background: transparent; font-size: 14px; outline: none; resize: none; line-height: 1.4; max-height: 120px; color: var(--gray-900); }
  .composer-input::placeholder { color: var(--gray-400); }
  .composer-btn { padding: 6px; border-radius: 8px; color: var(--gray-400); transition: all 0.15s; flex-shrink: 0; }
  .composer-btn:hover { color: var(--gray-600); background: var(--gray-200); }
  .send-btn { padding: 8px; border-radius: 10px; transition: all 0.15s; flex-shrink: 0; }
  .send-btn.active { background: var(--blue-500); color: white; box-shadow: 0 2px 6px rgba(59,130,246,0.3); }
  .send-btn.active:hover { background: var(--blue-600); }
  .send-btn.inactive { background: var(--gray-200); color: var(--gray-400); }
  .composer-hint { font-size: 11px; color: var(--gray-400); margin-top: 6px; padding-left: 4px; }
  .composer-hint kbd { padding: 1px 5px; background: var(--gray-200); border-radius: 4px; font-family: monospace; font-size: 10px; color: var(--gray-500); }

  /* Empty state */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(to bottom, var(--gray-50), white); }
  .empty-icon { width: 80px; height: 80px; background: var(--blue-50); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .empty-title { font-size: 22px; font-weight: 700; color: var(--gray-800); margin-bottom: 8px; }
  .empty-text { font-size: 14px; color: var(--gray-500); max-width: 280px; text-align: center; }
</style>
</head>

    plus: '<svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>',
    clip: '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>',
    smile: '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
    send: '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>',
    phone: '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>',
    video: '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>',
    check: '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>',
    dcheck: '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M1 13l4 4L15 7M8 13l4 4L22 7"/></svg>',
    emptychat: '<svg width="40" height="40" fill="none" stroke="#3b82f6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>',
  };
  return icons[type] || '';
}

function renderLogin() {
  return `
    <div class="login-page">
      <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
      <div class="login-card">
        <div class="login-logo">${svgIcon('chat')}</div>
        <div class="login-title">Exclusive Messenger</div>
        <div class="login-subtitle">Sign in to your workspace</div>
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Email</label>
            <div class="form-input-wrap">${svgIcon('mail')}<input class="form-input" type="email" value="sasha@exclusive.io"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="form-input-wrap">${svgIcon('lock')}<input class="form-input" type="password" value="password123"></div>
          </div>
          <div class="form-row">
            <label><input type="checkbox" checked> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>
          <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
        </form>
        <div class="login-footer">Don't have an account? <a href="#">Create one</a></div>
      </div>
    </div>`;
}

function renderApp() {
  const c = state.activeConv;
  const filtered = CONVOS.filter(cv => {
    if (!state.search) return true;
    const n = cv.name || cv.other?.name || '';
    return n.toLowerCase().includes(state.search.toLowerCase());
  });

  let sidebar = `
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-row">
          <div class="sidebar-title">Exclusive Messenger</div>
          <button class="icon-btn">${svgIcon('settings')}</button>
        </div>
        <div class="user-mini">
          ${avatar(ME.name, 'sm', true)}
          <div><div class="user-mini-name">${ME.name}</div><div class="user-mini-email">${ME.email}</div></div>
        </div>
      </div>
      <div class="search-wrap"><div class="search-box">${svgIcon('search')}<input class="search-input" id="searchInput" placeholder="Search conversations..." value="${state.search}"></div></div>
      <button class="new-chat-btn">${svgIcon('plus')} New Chat</button>
      <div class="conv-list">`;

  filtered.forEach(cv => {
    const name = cv.name || cv.other?.name || 'Chat';
    const active = c && c.id === cv.id ? ' active' : '';
    const online = cv.type === 'dm' ? cv.other.online : undefined;
    sidebar += `
      <button class="conv-item${active}" onclick="selectConv('${cv.id}')">
        ${avatar(name, 'md', online)}
        <div class="conv-info">
          <div class="conv-top">
            <div class="conv-name">${name}</div>
            <span class="conv-time${cv.unread?' unread':''}">${cv.lastTime}</span>
          </div>
          <div class="conv-bottom">
            <div class="conv-preview${cv.unread?' unread':''}">${cv.lastMsg}</div>
            ${cv.unread ? '<span class="conv-badge">'+cv.unread+'</span>' : ''}
          </div>
        </div>
      </button>`;
  });
  sidebar += '</div></div>';

  let main = '';
  if (!c) {
    main = `<div class="empty-state"><div class="empty-icon">${svgIcon('emptychat')}</div><div class="empty-title">Exclusive Messenger</div><div class="empty-text">Select a conversation from the sidebar or start a new chat to begin messaging.</div></div>`;
  } else {
    const name = c.name || c.other?.name || 'Chat';
    const online = c.type==='dm' ? c.other.online : undefined;
    const statusText = c.type==='group' ? c.members.length+' members' : (c.other?.online?'Online':'Offline');
    const msgs = state.messages[c.id] || MSGS[c.id] || [];

    let msgsHtml = '<div class="date-sep"><div class="date-sep-line"></div><span class="date-sep-text">Today</span><div class="date-sep-line"></div></div>';
    msgs.forEach(m => {
      const isGroup = c.type === 'group';
      let reactionsHtml = '';
      const rxns = Object.entries(m.reactions || {});
      if (rxns.length) {
        reactionsHtml = '<div class="msg-reactions">' + rxns.map(([e,cnt]) =>
          '<span class="reaction-pill '+(m.own?'own-bg':'other-bg')+'">'+e+' '+cnt+'</span>'
        ).join('') + '</div>';
      }
      let checkHtml = '';
      if (m.own) {
        checkHtml = m.read
          ? '<span class="msg-check read">'+svgIcon('dcheck')+'</span>'
          : '<span class="msg-check">'+svgIcon('check')+'</span>';
      }

      msgsHtml += `
        <div class="msg-row${m.own?' own':''}">
          <div class="msg-group">
            ${!m.own && isGroup ? avatar(m.from, 'sm') : ''}
            <div class="msg-col">
              ${!m.own && isGroup ? '<div class="msg-sender">'+m.from.split(' ')[0]+'</div>' : ''}
              <div class="msg-bubble ${m.own?'own':'other'}">
                <div class="msg-hover-actions">
                  <button class="msg-hover-btn">😊</button><button class="msg-hover-btn">👍</button><button class="msg-hover-btn">❤️</button>
                  <button class="msg-hover-btn" style="font-size:12px">↩</button>
                </div>
                ${m.text}
              </div>
              <div class="msg-meta"><span class="msg-time">${m.time}</span>${checkHtml}</div>
              ${reactionsHtml}
            </div>
          </div>
        </div>`;
    });

    if (state.typing) {
      const typingName = c.other?.name || c.members?.[1] || 'Someone';
      msgsHtml += `
        <div class="typing-row">
          ${avatar(typingName, 'sm')}
          <div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
        </div>`;
    }

    main = `
      <div class="chat-area">
        <div class="chat-header">
          <div class="chat-header-info">
            ${avatar(name, 'md', online)}
            <div><div class="chat-header-name">${name}</div><div class="chat-header-status">${statusText}</div></div>
          </div>
          <div class="chat-header-actions">
            <button class="icon-btn">${svgIcon('phone')}</button>
            <button class="icon-btn">${svgIcon('video')}</button>
            <button class="icon-btn">${svgIcon('search')}</button>
          </div>
        </div>
        <div class="messages" id="messagesContainer">${msgsHtml}<div id="messagesEnd"></div></div>
        <div class="composer">
          <div class="composer-inner" id="composerInner">
            <button class="composer-btn">${svgIcon('clip')}</button>
            <textarea class="composer-input" id="msgInput" rows="1" placeholder="Type a message..."></textarea>
            <button class="composer-btn">${svgIcon('smile')}</button>
            <button class="send-btn inactive" id="sendBtn" onclick="sendMessage()">${svgIcon('send')}</button>
          </div>
          <div class="composer-hint">Press <kbd>Enter</kbd> to send, <kbd>Shift+Enter</kbd> for new line</div>
        </div>
      </div>`;
  }

  return `<div class="app">${sidebar}${main}</div>`;
}

function render() {
  document.getElementById('app').innerHTML = state.screen === 'login' ? renderLogin() : renderApp();
  attachEvents();
  // Scroll messages to bottom
  const el = document.getElementById('messagesEnd');
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}

function attachEvents() {
  const form = document.getElementById('loginForm');
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Signing in...';
      setTimeout(function() { state.screen = 'app'; render(); }, 900);
    });
  }

  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function(e) {
      state.search = e.target.value;
      render();
      // re-focus search after re-render
      const si = document.getElementById('searchInput');
      if (si) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
    });
  }

  const msgInput = document.getElementById('msgInput');
  if (msgInput) {
    msgInput.focus();
    msgInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      const btn = document.getElementById('sendBtn');
      if (this.value.trim()) { btn.className = 'send-btn active'; } else { btn.className = 'send-btn inactive'; }
    });
    msgInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    msgInput.addEventListener('focus', function() { document.getElementById('composerInner').classList.add('focused'); });
    msgInput.addEventListener('blur', function() { document.getElementById('composerInner').classList.remove('focused'); });
  }
}

window.selectConv = function(id) {
  state.activeConv = CONVOS.find(c => c.id === id);
  if (state.activeConv && !state.messages[id]) {
    state.messages[id] = [...(MSGS[id] || [])];
  }
  state.typing = false;
  render();
};

window.sendMessage = function() {
  const input = document.getElementById('msgInput');
  if (!input || !input.value.trim() || !state.activeConv) return;
  const cid = state.activeConv.id;
  if (!state.messages[cid]) state.messages[cid] = [...(MSGS[cid] || [])];
  state.messages[cid].push({ id:'m'+Date.now(), from:'Sasha', own:true, text:input.value.trim(), time:'now', reactions:{}, read:false });
  state.typing = true;
  render();

  // Simulate reply
  const other = state.activeConv.other?.name || state.activeConv.members?.[1] || 'User';
  const replies = ['Got it, thanks!','Sounds good!','Let me check that.','Great idea!','I\'ll look into it.','Thanks for the update!','On it!','Perfect, will do.'];
  setTimeout(function() {
    state.typing = false;
    if (!state.messages[cid]) state.messages[cid] = [];
    state.messages[cid].push({ id:'m'+(Date.now()+1), from:other, own:false, text:replies[Math.floor(Math.random()*replies.length)], time:'now', reactions:{} });
    render();
  }, 1500 + Math.random() * 1000);
};

// Initial render
render();
</script>
</body>
</html>
